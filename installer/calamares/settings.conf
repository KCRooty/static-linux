---
# Static Linux — Calamares installer sequence.
#
# Live pacman install (no unpackfs/squashfs base) — sl-detect's whole point
# is to let the *live* choice of environment/fs/kernel drive what actually
# gets installed, which needs live package operations rather than one
# baked-in default per ISO. See docs/wiki/instalacion.md for the equivalent
# manual (non-Calamares) steps this sequence automates.
#
# First run on real Calamares: 2026-10-11, ISO booted in QEMU/KVM.

# "local" is Calamares' own module directory (/usr/lib/calamares/modules).
# The Static Linux job modules ship next to this file instead, so that
# directory has to be searched too or none of them are found.
modules-search: [ local, /etc/calamares/modules ]

instances:
- id:      entorno
  module:  packagechooser
  config:  entorno/module.conf
- id:      privacidad
  module:  packagechooser
  config:  privacidad/module.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@entorno
  - packagechooser@privacidad
  - users
  - summary
- exec:
  # First job of the install: its results (slRecommendedKernel, ...) feed
  # basepkgs and the jobs after it. It used to be its own exec block right
  # after the welcome page so the UI pages could use the recommendation,
  # but Calamares treats any exec block as "the install" — on a real run
  # that showed the "about to make changes to your disk" prompt and an
  # "Install" step before the user had chosen anything.
  - sl-detect
  - partition
  - mount
  - basepkgs
  - entorno-pkgs
  - privacidad-apply
  - sabores
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - accent
  - display
  - luks
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: staticlinux

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
