---
# Static Linux — Calamares installer sequence.
#
# Live pacman install (no unpackfs/squashfs base) — sl-detect's whole point
# is to let the *live* choice of environment/fs/kernel drive what actually
# gets installed, which needs live package operations rather than one
# baked-in default per ISO. See docs/wiki/instalacion.md for the equivalent
# manual (non-Calamares) steps this sequence automates.
#
# Verify on real Calamares before shipping (CONTRIBUTING.md: test before
# merge) — this was written against the upstream Calamares source/docs
# without a live Calamares run to confirm against. Two things flagged
# in-line below as the most likely to need a tweak: the `entorno`/
# `privacidad` sequence keys (packagechooser instance references) and
# whether the "sl-detect" exec job genuinely runs before the `show` block
# that follows it (Calamares evaluates sequence in file order, but this
# combination — a single-module exec block sandwiched between two show
# blocks — isn't one we've run for real yet).

modules-search: [ local ]

instances:
- id:      entorno
  module:  packagechooser
  config:  modules/entorno/module.conf
- id:      privacidad
  module:  packagechooser
  config:  modules/privacidad/module.conf

sequence:
- show:
  - welcome
- exec:
  # Runs before the partition/entorno/privacidad pages so their
  # recommendations (slRecommendedEnv, slRecommendedFs, ...) are in
  # globalStorage in time to matter. See modules/sl-detect/main.py.
  - sl-detect
- show:
  - locale
  - keyboard
  - partition
  - packagechooser@entorno
  - packagechooser@privacidad
  - users
  - summary
- exec:
  - partition
  - mount
  - basepkgs
  - entorno-pkgs
  - privacidad-apply
  - sabores
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - accent
  - luks
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - umount
- show:
  - finished

branding: staticlinux

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
