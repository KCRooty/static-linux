---
# Static Linux — only the display managers the environments actually ship.
# gdm first: it only exists when GNOME was picked (its lock screen needs it);
# everything else keeps lightdm, which is always installed.
displaymanagers:
  - gdm
  - lightdm
  - sddm
basicSetup: false
sysconfigSetup: false
lightdm:
  preferred_greeters: ["lightdm-gtk-greeter.desktop"]
sddm:
  configuration_file: "/etc/sddm.conf"
