---
# Static Linux — units enabled on the installed system.
# Display managers are `mandatory: false`: which one exists depends on the
# chosen environment (lightdm for XFCE/Openbox, sddm for Hyprland).
units:
  - name: "NetworkManager"
    action: "enable"
    mandatory: true
  - name: "systemd-timesyncd"
    action: "enable"
    mandatory: false
  - name: "fstrim.timer"
    action: "enable"
    mandatory: false
  - name: "lightdm"
    action: "enable"
    mandatory: false
  - name: "sddm"
    action: "enable"
    mandatory: false
