---
# Static Linux — partitioning.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        260MiB
    label:              "EFI"

userSwapChoices:
    - none
    - small
    - file

luksGeneration: luks2
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: none

# Static default. sl-detect's filesystem recommendation
# (globalStorage slRecommendedFs) is not wired into this page yet.
defaultFileSystemType:  "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs", "f2fs" ]

essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
