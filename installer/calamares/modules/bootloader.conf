---
# Static Linux — GRUB, on both UEFI and BIOS.
efiBootLoader: "grub"
efiBootloaderId: "StaticLinux"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Always also write /EFI/BOOT/BOOTX64.EFI. Phase 1 lesson: the iMedia's
# UEFI rejected efibootmgr entries (I/O error) and only booted the
# fallback path.
installEFIFallback: true
installHybridGRUB: false
