# Static Linux — the "Sabores" page: packagechooser instance `sabores`
# (settings.conf `instances:`). Multiple choice, none required; the job module
# `sabores` (exec phase) reads globalStorage["packagechooser_sabores"] and
# installs + tunes each one.

mode: optionalmultiple
method: legacy

labels:
  step: "Sabores"

items:
  - id: ""
    screenshot: "cards/sabores.png"
    name: "Sabores (opcional)"
    description: >-
      Paquetes de apps listos para lo que vayas a hacer. Marca los que
      quieras (puedes elegir varios o ninguno): se instalan con el sistema y
      cada uno viene ajustado para rendir bien. Todo se puede añadir o quitar
      después desde la bienvenida.

  - id: gaming
    screenshot: "cards/gaming.png"
    name: "Gaming"
    description: >-
      Steam con Proton, Lutris, Heroic (Epic, GOG, Amazon), Prism Launcher y
      Modrinth para Minecraft, MangoHud, GameMode y Gamescope. Activa las
      librerías de 32 bits y el driver Vulkan de tu GPU.

  - id: content-creation
    screenshot: "cards/content-creation.png"
    name: "Creación de contenido"
    description: >-
      Krita, GIMP, Inkscape, Blender, Kdenlive, Shotcut, OBS, Audacity y los
      DAWs Ardour, LMMS e Hydrogen, con audio en tiempo real (baja latencia).

  - id: development
    screenshot: "cards/development.png"
    name: "Desarrollo"
    description: >-
      Git y GitHub CLI, Docker (se arranca solo al usarlo), VS Code (Code -
      OSS), Python, Rust, Node y Java.

  - id: office
    screenshot: "cards/office.png"
    name: "Oficina"
    description: >-
      LibreOffice en español con corrector, Obsidian, KeePassXC, Xournal++ y
      herramientas de PDF.

  - id: vm
    screenshot: "cards/vm.png"
    name: "Máquinas virtuales"
    description: >-
      KVM/QEMU con virt-manager y GNOME Boxes, con TPM y UEFI para invitados
      Windows 11.

  - id: education
    screenshot: "cards/education.png"
    name: "Educación"
    description: >-
      GeoGebra, Stellarium, Anki, Jupyter y FreeCAD.

  - id: cybersecurity
    screenshot: "cards/cybersecurity.png"
    name: "Ciberseguridad"
    description: >-
      Nmap, Wireshark, Hashcat, John, Metasploit, Ghidra y Tor.

  - id: server
    screenshot: "cards/server.png"
    name: "Servidor / Homelab"
    description: >-
      Docker, Nginx, MariaDB, WireGuard, Fail2ban y Cockpit. Por seguridad
      ningún servicio se queda escuchando hasta que tú lo actives.
