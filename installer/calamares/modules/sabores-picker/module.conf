    description: >-
      Paquetes de apps listos para lo que vayas a hacer. Marca los que
      quieras (puedes elegir varios o ninguno): se instalan con el sistema y
      cada uno viene ajustado para rendir bien. Todo se puede añadir o quitar
      después desde la bienvenida.
    description[ca]: "Paquets d'apps a punt per al que hagis de fer. Marca els que vulguis (pots triar-ne diversos o cap): s'instal·len amb el sistema i cadascun ve ajustat per rendir bé. Tot es pot afegir o treure després des de la benvinguda."
    description[de]: "App-Pakete für das, was du vorhast. Hake an, was du willst (mehrere oder keine): Sie werden mit dem System installiert und sind jeweils auf gute Leistung abgestimmt. Alles lässt sich später in der Willkommens-App hinzufügen oder entfernen."
    description[en]: "App bundles ready for whatever you're going to do. Tick the ones you want (several or none): they're installed with the system and each one comes tuned to perform well. Everything can be added or removed later from the welcome app."
    description[eu]: "Egingo duzunerako prest dauden aplikazio-paketeak. Markatu nahi dituzunak (hainbat edo bat ere ez): sistemarekin batera instalatzen dira eta bakoitza ondo errenditzeko doituta dator. Dena gehitu edo kendu daiteke gero ongietorri-aplikaziotik."
    description[fr]: "Des lots d'apps prêts pour ce que tu vas faire. Coche ceux que tu veux (plusieurs ou aucun) : ils s'installent avec le système et chacun est réglé pour bien tourner. Tout peut être ajouté ou retiré plus tard depuis l'accueil."
    description[gl]: "Paquetes de apps listos para o que vaias facer. Marca os que queiras (varios ou ningún): instálanse co sistema e cada un vén axustado para render ben. Todo se pode engadir ou quitar despois desde a benvida."
    description[it]: "Pacchetti di app pronti per quello che devi fare. Seleziona quelli che vuoi (più d'uno o nessuno): si installano con il sistema e ognuno è regolato per rendere bene. Tutto si può aggiungere o togliere dopo dal benvenuto."
    description[ja]: "やりたいことに合わせたアプリのセット。好きなものを選べます (複数でもなしでも)。システムと一緒にインストールされ、それぞれ快適に動くよう調整済み。あとからウェルカムアプリで追加・削除できます。"
    description[ko]: "하려는 일에 맞춘 앱 묶음입니다. 원하는 것을 선택하세요 (여러 개 또는 없음): 시스템과 함께 설치되며 각각 잘 돌아가도록 조정되어 있습니다. 나중에 환영 앱에서 추가하거나 뺄 수 있습니다."
    description[nl]: "App-pakketten klaar voor wat je gaat doen. Vink aan wat je wilt (meerdere of geen): ze worden met het systeem geïnstalleerd en elk is afgesteld om goed te presteren. Alles kan later worden toegevoegd of verwijderd in de welkomst-app."
    description[pl]: "Zestawy aplikacji gotowe do tego, co zamierzasz robić. Zaznacz, które chcesz (kilka lub żaden): instalują się razem z systemem, a każdy jest dostrojony do dobrej wydajności. Wszystko można później dodać lub usunąć w aplikacji powitalnej."
    description[pt_PT]: "Pacotes de aplicações prontos para o que vais fazer. Marca os que quiseres (vários ou nenhum): instalam-se com o sistema e cada um vem ajustado para render bem. Tudo pode ser adicionado ou removido depois na aplicação de boas-vindas."
    description[pt_BR]: "Pacotes de apps prontos para o que você vai fazer. Marque os que quiser (vários ou nenhum): são instalados com o sistema e cada um vem ajustado para render bem. Tudo pode ser adicionado ou removido depois pela tela de boas-vindas."
    description[ru]: "Наборы приложений для того, чем вы собираетесь заниматься. Отметьте нужные (несколько или ни одного): они устанавливаются вместе с системой, и каждый настроен на хорошую производительность. Всё можно добавить или убрать позже в приложении приветствия."
    description[tr]: "Yapacağın işe hazır uygulama paketleri. İstediklerini işaretle (birkaç tane veya hiç): sistemle birlikte kurulur ve her biri iyi çalışacak şekilde ayarlıdır. Her şey sonradan karşılama uygulamasından eklenip çıkarılabilir."
    description[uk]: "Набори застосунків для того, чим ви збираєтеся займатися. Позначте потрібні (кілька або жодного): вони встановлюються разом із системою, і кожен налаштований на добру продуктивність. Усе можна додати чи прибрати пізніше в застосунку привітання."
    description[zh_CN]: "为你要做的事准备好的应用组合。勾选你想要的（可多选或不选）：它们随系统一起安装，并且都已调校好。之后都可以在欢迎应用中添加或移除。"

