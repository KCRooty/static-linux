# Static Linux — the "Estilo" page: packagechooser instance `estilo`
# (settings.conf `instances:`). The look of the whole system — wallpaper,
# window/control shapes and fonts — independent of the accent colour.
# entorno-pkgs writes the choice to /etc/static-linux/style before any
# environment is set up; the accent job applies it.

mode: required
method: legacy
default: retro

labels:
  step: "Estilo"

items:
  - id: retro
    screenshot: "cards/style-retro.png"
    name: "Retro 70s"
    description: >-
      El estilo de Static Linux: fondo oscuro con rayas groovy de los 70 en
      los tonos de tu color, esquinas suaves y tipografía Space Grotesk.

  - id: cyberpunk
    screenshot: "cards/style-cyberpunk.png"
    name: "Cyberpunk"
    description: >-
      El clásico: rejilla neón con sol al horizonte, bordes duros, brillos al
      pasar el ratón y títulos en monoespaciada.

  - id: liquid
    screenshot: "cards/style-liquid.png"
    name: "Líquido"
    description: >-
      Minimalista, al estilo Apple: manchas de color difuminadas, menús y
      panel translúcidos, esquinas muy redondeadas y tipografía Inter.
