---
# Static Linux — welcome page.
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
# No donate button: zero paywalls, zero nagging.
showDonateUrl:          false

requirements:
    # GiB. 10 GB / 512 MB are the absolute-minimum tier (openbox-minimal).
    requiredStorage:    10
    requiredRam:        0.5
    # Calamares installs live with pacman — no network, no install.
    internetCheckUrl:   https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - internet
        - root

# Zero telemetry: never ask a third party where this machine is.
geoip:
    style:    "none"
