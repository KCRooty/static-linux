# Static Linux — /etc/default/grub on the target, written before the
# bootloader job runs grub-mkconfig. Without this module the stock Arch file
# stayed in place and the installed system's boot menu said "Arch Linux".
# GRUB_DISTRIBUTOR comes from branding.desc's bootloaderEntryName.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: false
