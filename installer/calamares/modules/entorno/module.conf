---
# Static Linux — instance config for Calamares' built-in "packagechooser"
# module (id: entorno, see settings.conf's `instances:` section). This is a
# picker page only — method: legacy just records the chosen id into
# globalStorage["packagechooser_entorno"]; the "entorno-pkgs" job module
# (exec phase) reads that key and does the real work: installs
# packages/lists/<slug>.list and runs entornos/<slug>/install.sh --skel.
#
# Not `method: packages`: that mechanism only installs packages, and every
# environment here also needs its install.sh run for dotfiles/theming — a
# plain package list can't do that, so a dedicated job module does both.
#
# sl-detect's recommendation (globalStorage["slRecommendedEnv"]) isn't
# threaded into a dynamic default here — not confirmed whether
# packagechooser supports a globalStorage-driven preselect. xfce-themed is
# first in the list (and the only environment validated on real hardware
# so far) as the static, safe default. Verify on real Calamares whether
# `default: <id>` or similar exists before assuming this is unchangeable.

mode: required
method: legacy

labels:
  step: "Entorno de escritorio"

items:
  - id: xfce-themed
    name: "XFCE (temático)"
    description: >-
      El entorno validado en hardware real (Packard Bell iMedia S2883).
      Xorg, ligero, recomendado desde 1 GB de RAM o cuando la GPU no
      soporta Wayland.

  - id: openbox-minimal
    name: "Openbox minimal"
    description: >-
      El nivel más bajo — 512 MB. Openbox + tint2 + jgmenu, sin
      compositor por defecto.

  - id: hyprland-astal-lite
    name: "Hyprland + Astal (lite)"
    description: >-
      Wayland, 2-4 GB. Mismo shell Astal que la versión full, sin
      blur/sombras/animaciones pesadas.

  - id: hyprland-astal-full
    name: "Hyprland + Astal (full)"
    description: >-
      Wayland, techo recomendado de 4 GB. Blur, sombras y animaciones
      completas — necesita una GPU con buen soporte de Wayland.
