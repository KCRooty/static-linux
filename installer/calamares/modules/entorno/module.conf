---
# Static Linux — instance config for Calamares' built-in "packagechooser"
# module (id: entorno, see settings.conf's `instances:` section). This is a
# picker page only — method: legacy just records the chosen id into
# globalStorage["packagechooser_entorno"]; the "entorno-pkgs" job module
# (exec phase) reads that key and does the real work: installs
# packages/lists/<slug>.list and runs entornos/<slug>/install.sh --skel.
#
# Not `method: packages`: that mechanism only installs packages, and every
# environment here also needs its install.sh run for dotfiles/theming — a
# plain package list can't do that, so a dedicated job module does both.
#
# Preselection: `default:` below is the fallback; the live session's
# iso/airootfs-common/root/.xinitrc rewrites it to sl-detect's
# --recommend-env before Calamares starts. A preselected item also makes the
# page show its description up front instead of the stock "Package
# Selection" placeholder.

mode: required
method: legacy
default: xfce-themed

labels:
  step: "Entorno de escritorio"
  step[ca]: "Entorn d'escriptori"
  step[de]: "Desktop-Umgebung"
