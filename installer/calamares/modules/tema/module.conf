# Static Linux — the "Tema" page: packagechooser instance `tema`
# (settings.conf `instances:`). A theme is a wallpaper, a palette taken from
# it and a style (window and bar shapes); see DESIGN.md.
# entorno-pkgs records the choice in /etc/static-linux/theme before the
# environment is set up; the tema-apply job applies it with sl-theme.
# The screenshots are real captures of each theme (cards/theme-*.png).
# Ids must match folders in branding/themes/.

mode: required
method: legacy
default: ambar

labels:
  step: "Tema"
  step[de]: "Design"
  step[en]: "Theme"
  step[eu]: "Gaia"
  step[fr]: "Thème"
