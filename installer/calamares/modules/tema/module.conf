# Static Linux — the "Tema" page: packagechooser instance `tema`
# (settings.conf `instances:`). A theme is a wallpaper, a palette taken from
# it and a style (window and bar shapes); see DESIGN.md.
# entorno-pkgs records the choice in /etc/static-linux/theme before the
# environment is set up; the tema-apply job applies it with sl-theme.
# The screenshots are real captures of each theme (cards/theme-*.png).
# Ids must match folders in branding/themes/.

mode: required
method: legacy
default: ambar

labels:
  step: "Tema"

items:
  - id: ambar
    screenshot: "cards/theme-ambar.png"
    name: "Ámbar"
    description: >-
      El tema de Static Linux. Oscuro y cálido: madera, mostaza y verde
      azulado, sobre «Tormenta bajo el Fuji» de Hokusai. Barra fina arriba y
      ventanas sólidas.

  - id: papel
    screenshot: "cards/theme-papel.png"
    name: "Papel"
    description: >-
      Claro, en tonos de papel envejecido, tinta y verde oliva, sobre un
      grabado de Hokusai. Para quien trabaja con mucha luz.

  - id: nordico
    screenshot: "cards/theme-nordico.png"
    name: "Nórdico"
    description: >-
      Oscuro y frío: pizarra azulada y hielo, sobre «Nieve al anochecer en
      Kanbara» de Hiroshige.

  - id: bosque
    screenshot: "cards/theme-bosque.png"
    name: "Bosque"
    description: >-
      Oscuro, en verdes de pino y niebla, sobre «Lluvia de primavera en
      Tsuchiyama» de Hiroshige.

  - id: sakura
    screenshot: "cards/theme-sakura.png"
    name: "Sakura"
    description: >-
      Oscuro con rosa cerezo, sobre «El Fuji desde Gotenyama» de Hokusai.

  - id: violeta
    screenshot: "cards/theme-violeta.png"
    name: "Violeta"
    description: >-
      Oscuro y monocromo en violeta, con montañas al anochecer.

  - id: aero
    screenshot: "cards/theme-aero.png"
    name: "Aero"
    description: >-
      Estilo Frutiger Aero: claro, con cielo, burbujas y hierba, barras con
      brillo y la barra de tareas abajo.

  - id: ventanas
    screenshot: "cards/theme-ventanas.png"
    name: "Ventanas"
    description: >-
      Parecido a Windows: oscuro, barra de tareas abajo con las apps al
      centro y botones de ventana ─ □ ✕.

  - id: nube
    screenshot: "cards/theme-nube.png"
    name: "Nube"
    description: >-
      Claro y suave, sobre un cielo con nubes. Lanzador redondo y estante
      abajo con las apps al centro; la hora abre los ajustes rápidos.
