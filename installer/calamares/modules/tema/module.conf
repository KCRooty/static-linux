    description: >-
      El tema de Static Linux. Oscuro y cálido: madera, mostaza y verde
      azulado, sobre «Tormenta bajo el Fuji» de Hokusai. Barra fina arriba y
      ventanas sólidas.
    description[ca]: "El tema de Static Linux. Fosc i càlid: fusta, mostassa i verd blavós, sobre «Tempesta sota el Fuji» de Hokusai. Barra fina a dalt i finestres sòlides."
    description[de]: "Das Design von Static Linux. Dunkel und warm: Holz, Senf und Blaugrün, über Hokusais «Gewitter unter dem Fuji». Schmale Leiste oben und massive Fenster."
    description[en]: "The Static Linux theme. Dark and warm: wood, mustard and teal, over Hokusai's «Storm below Mount Fuji». Thin bar at the top and solid windows."
    description[eu]: "Static Linux-en gaia. Iluna eta beroa: egurra, ziapea eta berde urdinxka, Hokusairen «Ekaitza Fujiren azpian» lanaren gainean. Barra mehea goian eta leiho sendoak."
    description[fr]: "Le thème de Static Linux. Sombre et chaleureux : bois, moutarde et bleu-vert, sur «Orage sous le Fuji» d'Hokusai. Barre fine en haut et fenêtres pleines."
    description[gl]: "O tema de Static Linux. Escuro e cálido: madeira, mostaza e verde azulado, sobre «Tormenta baixo o Fuji» de Hokusai. Barra fina arriba e xanelas sólidas."
    description[it]: "Il tema di Static Linux. Scuro e caldo: legno, senape e verde acqua, su «Temporale sotto il Fuji» di Hokusai. Barra sottile in alto e finestre piene."
    description[ja]: "Static Linux のテーマ。暗く温かい: 木、マスタード、ティール。背景は北斎「山下白雨」。上部に細いバー、不透明なウィンドウ。"
    description[ko]: "Static Linux의 테마. 어둡고 따뜻함: 나무, 겨자, 청록. 배경은 호쿠사이의 «산하백우». 위쪽 얇은 막대와 불투명한 창."
    description[nl]: "Het thema van Static Linux. Donker en warm: hout, mosterd en blauwgroen, over «Onweer onder de Fuji» van Hokusai. Dunne balk bovenaan en massieve vensters."
    description[pl]: "Motyw Static Linux. Ciemny i ciepły: drewno, musztarda i morska zieleń, na tle «Burzy pod Fudżi» Hokusaia. Cienki pasek na górze i pełne okna."
    description[pt_PT]: "O tema do Static Linux. Escuro e quente: madeira, mostarda e verde-azulado, sobre «Tempestade sob o Fuji» de Hokusai. Barra fina em cima e janelas sólidas."
    description[pt_BR]: "O tema do Static Linux. Escuro e quente: madeira, mostarda e verde-azulado, sobre «Tempestade sob o Fuji» de Hokusai. Barra fina em cima e janelas sólidas."
    description[ru]: "Тема Static Linux. Тёмная и тёплая: дерево, горчица и бирюза, на фоне «Грозы под Фудзи» Хокусая. Тонкая панель сверху и сплошные окна."
    description[tr]: "Static Linux'un teması. Koyu ve sıcak: ahşap, hardal ve camgöbeği; Hokusai'nin «Fuji'nin altında fırtına» eserinin üstünde. Üstte ince çubuk ve dolu pencereler."
    description[uk]: "Тема Static Linux. Темна й тепла: дерево, гірчиця й бірюза, на тлі «Грози під Фудзі» Хокусая. Тонка панель угорі та суцільні вікна."
    description[zh_CN]: "Static Linux 的主题。深色温暖：木色、芥末黄和蓝绿，背景是葛饰北斋《山下白雨》。顶部细栏，实心窗口。"

