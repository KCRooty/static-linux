    description[ca]: "Clar i suau, sobre un cel amb núvols. Llançador rodó i prestatge a baix amb les apps al centre; l'hora obre els ajustos ràpids."
    description[de]: "Hell und sanft, über einem Wolkenhimmel. Runder Starter und Regal unten mit zentrierten Apps; die Uhr öffnet die Schnelleinstellungen."
    description[en]: "Light and soft, over a cloudy sky. Round launcher and a shelf at the bottom with centred apps; the clock opens quick settings."
    description[eu]: "Argia eta leuna, hodeiz betetako zeru baten gainean. Abiarazle biribila eta apala behean aplikazioak erdian; orduak ezarpen azkarrak irekitzen ditu."
    description[fr]: "Clair et doux, sur un ciel nuageux. Lanceur rond et étagère en bas avec les apps au centre ; l'heure ouvre les réglages rapides."
    description[gl]: "Claro e suave, sobre un ceo con nubes. Lanzador redondo e estante abaixo coas apps no centro; a hora abre os axustes rápidos."
    description[it]: "Chiaro e morbido, su un cielo nuvoloso. Launcher rotondo e scaffale in basso con le app al centro; l'ora apre le impostazioni rapide."
    description[ja]: "明るくやわらか、雲のある空を背景に。丸いランチャーとアプリ中央寄せのシェルフが下。時計でクイック設定が開きます。"
    description[ko]: "밝고 부드러움, 구름 낀 하늘 배경. 둥근 실행기와 앱이 가운데인 선반이 아래. 시계를 누르면 빠른 설정이 열립니다."
    description[nl]: "Licht en zacht, over een bewolkte lucht. Ronde starter en plank onderaan met gecentreerde apps; de klok opent de snelle instellingen."
    description[pl]: "Jasny i łagodny, na tle zachmurzonego nieba. Okrągły program uruchamiający i półka na dole z aplikacjami pośrodku; zegar otwiera szybkie ustawienia."
    description[pt_PT]: "Claro e suave, sobre um céu com nuvens. Lançador redondo e estante em baixo com as aplicações ao centro; o relógio abre as definições rápidas."
    description[pt_BR]: "Claro e suave, sobre um céu com nuvens. Lançador redondo e estante embaixo com os apps no centro; o relógio abre as configurações rápidas."
    description[ru]: "Светлая и мягкая, на фоне облачного неба. Круглый лаунчер и полка внизу с приложениями по центру; часы открывают быстрые настройки."
    description[tr]: "Açık ve yumuşak, bulutlu bir gökyüzünün üstünde. Yuvarlak başlatıcı ve ortada uygulamalarla altta raf; saat hızlı ayarları açar."
    description[uk]: "Світла й м'яка, на тлі хмарного неба. Круглий лаунчер і полиця внизу із застосунками по центру; годинник відкриває швидкі налаштування."
    description[zh_CN]: "浅色柔和，背景是多云的天空。圆形启动器和底部架子、应用居中；点时钟打开快速设置。"
