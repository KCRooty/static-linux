---
# Static Linux — instance config for Calamares' built-in "packagechooser"
# module (id: privacidad, see settings.conf's `instances:` section).
# method: legacy records the chosen id into
# globalStorage["packagechooser_privacidad"]; the "privacidad-apply" job
# module (exec phase) reads it and runs the matching
# privacidad/<perfil>/apply.sh in the target — same profile-name mapping
# sl-welcome/src/privileged.py uses post-install.

mode: required
method: legacy
# preselected, so the page opens with a description instead of the stock
# "Package Selection" placeholder
default: basico

labels:
  step: "Perfil de privacidad"

items:
  - id: basico
    screenshot: "cards/basico.png"
    name: "Básico"
    description: >-
      Defaults de día 0 + UFW + aleatorización de MAC. Kernel linux-zen.

  - id: mejorado
    screenshot: "cards/mejorado.png"
    name: "Mejorado"
    description: >-
      + Firejail + AppArmor + USBGuard. Kernel linux-zen.

  - id: maximo
    screenshot: "cards/maximo.png"
    name: "Máximo"
    description: >-
      + Tor + kloak + swap cifrado. Kernel linux-hardened.
