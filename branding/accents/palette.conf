# Static Linux — accent palette
#
# One row per selectable accent. The installer offers this list; the default
# is the first row (purple). Every themed component (fastfetch, GTK, xfwm4,
# terminal, wallpaper, greeter) derives its colours from here via apply.sh.
#
# Fields (| separated):
#   name    : id used on disk and by apply.sh / the installer
#   accent  : main accent hex (no #)   — dominant colour
#   dim     : muted accent             — taglines, inactive borders, rules
#   detail  : tiny secondary accent    — % readouts, small marks (kept small)
#   text    : primary foreground
#   bg      : desktop / terminal background
#   label   : human name (Spanish), shown in the installer
#
# name      accent   dim      detail   text     bg       label
purple    | C0A0F0 | 8A78AA | F2C94C | D6D8E0 | 0B0C10 | Morado
