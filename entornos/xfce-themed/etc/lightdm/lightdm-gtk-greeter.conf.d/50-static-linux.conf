# Static Linux — LightDM GTK greeter, Void background + Signal Green accent
[greeter]
background = #0B0C10
theme-name = Adwaita-dark
icon-theme-name = Papirus-Dark
font-name = Space Grotesk 11
xft-antialias = true
xft-hintstyle = slight
xft-rgba = rgb
cursor-theme-name = Adwaita
cursor-theme-size = 24
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %H:%M  ·  %A %d %B
position = 50%,center 55%,center
default-user-image = /usr/share/pixmaps/static-linux/avatar-default.png
# Static Forge SF monogram, shown above the login box
# logo = /usr/share/pixmaps/static-linux/sf-monogram.png
