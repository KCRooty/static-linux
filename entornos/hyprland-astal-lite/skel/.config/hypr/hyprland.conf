# Static Linux — Hyprland (Astal lite tier, 2-4 GB RAM + Wayland-capable GPU)
# Same shell as hyprland-astal-full (~/.config/ags/) — this file only strips
# the compositor effects that cost RAM/CPU: no blur, no shadows, minimal
# animation. Thunar instead of Nautilus, no dock.

# ---- Monitors --------------------------------------------------------
monitor = , preferred, auto, 1

# ---- Autostart --------------------------------------------------------
exec-once = ags run ~/.config/ags/app.ts
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = /usr/bin/sl-welcome --autostart

# ---- Environment --------------------------------------------------------
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

# ---- Input --------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# ---- General --------------------------------------------------------------
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(C0A0F0FF)
    col.inactive_border = rgba(2A2B33AA)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ---- Decoration (no blur, no shadows — this is the lite tier) -------------
decoration {
    rounding = 4

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }

    active_opacity = 1.0
    inactive_opacity = 1.0
}

# ---- Animations (minimal — fade only, no slide/popin) ---------------------
animations {
    enabled = true
    animation = windows, 1, 3, default, fade
    animation = windowsOut, 1, 3, default, fade
    animation = border, 0
    animation = fade, 1, 3, default
    animation = workspaces, 0
}

# ---- Layout --------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# ---- Gestures --------------------------------------------------------------
gestures {
    workspace_swipe = false
}

# ---- Misc --------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
}

# ---- Keybindings ----------------------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, E, exec, thunar
bind = $mod, D, exec, rofi -show drun
bind = $mod, F, togglefloating,
bind = $mod, M, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d-%H%M%S).png

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
