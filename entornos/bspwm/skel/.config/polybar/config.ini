; Static Linux — polybar for bspwm. Colours: colors.ini, written by sl-theme.
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 30
background = ${colors.bg}
foreground = ${colors.fg}
border-bottom-size = 1
border-bottom-color = ${colors.line}
padding-right = 2
module-margin = 1
font-0 = ${colors.font}
modules-left = bspwm
modules-center = date
modules-right = network pulseaudio battery tray
enable-ipc = true
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.accent-fg}
label-focused-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.danger}
label-urgent-padding = 2

[module/date]
type = internal/date
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/network]
type = internal/network
interface-type = wireless
label-connected = %essid%
label-disconnected =

[module/pulseaudio]
type = internal/pulseaudio
label-volume = vol %percentage%%
label-muted = vol —
label-muted-foreground = ${colors.dim}

[module/battery]
type = internal/battery
label-charging = %percentage%%
label-discharging = %percentage%%
label-full =

[module/tray]
type = internal/tray
tray-spacing = 6
