# Static Linux — picom (Openbox minimal tier). OFF by default (see
# ~/.config/openbox/autostart) — this config exists for hardware with RAM to
# spare. Deliberately minimal: no blur, no animations, low CPU.

backend = "xrender";
vsync = false;

shadow = false;
fading = false;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;

corner-radius = 0;
blur-method = "none";

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = false;
use-damage = true;

wintypes: {
  tooltip = { opacity = 1.0; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
