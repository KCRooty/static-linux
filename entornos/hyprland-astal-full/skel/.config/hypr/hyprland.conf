# Static Linux — Hyprland (Astal full tier, >=4 GB RAM + Wayland-capable GPU)
# sl-detect only recommends this environment when wayland_ok is true, so
# blur/shadows/animations are safe to leave on here. See hyprland-astal-lite
# for the same config with effects stripped for 2-4 GB machines.

# ---- Monitors --------------------------------------------------------
monitor = , preferred, auto, 1

# ---- Autostart --------------------------------------------------------
exec-once = ags run ~/.config/ags/app.ts
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = /usr/bin/sl-welcome --autostart

# ---- Environment --------------------------------------------------------
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

# ---- Input --------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# ---- General --------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(C0A0F0FF) rgba(00C8A0FF) 45deg
    col.inactive_border = rgba(2A2B33AA)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ---- Decoration (blur/shadows on — this is the full tier) -----------------
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(0B0C10AA)
    }

    active_opacity = 1.0
    inactive_opacity = 0.94
}

# ---- Animations (on) --------------------------------------------------
animations {
    enabled = true

    bezier = slSmooth, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, slSmooth, popin 85%
    animation = windowsOut, 1, 4, slSmooth, popin 85%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, slSmooth, slide
}

# ---- Layout --------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# ---- Gestures --------------------------------------------------------------
gestures {
    workspace_swipe = true
}

# ---- Misc --------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
}

# ---- Keybindings ----------------------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, E, exec, thunar
bind = $mod, D, exec, rofi -show drun
bind = $mod, F, togglefloating,
bind = $mod, M, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d-%H%M%S).png

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ---- Window rules ---------------------------------------------------------
windowrulev2 = opacity 0.96 0.90, class:^(kitty)$
