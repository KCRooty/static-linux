# Static Linux — kernel defaults for a responsive desktop (fast. private. yours.)
# Installed to /usr/lib/sysctl.d/; anything in /etc/sysctl.d/ wins. Values
# follow CachyOS-Settings and the Arch wiki, tuned for zram swap. See
# rendimiento/README.md in the repo for the reasoning behind each line.

# zram is compressed RAM, far cheaper than evicting page cache: swap early.
vm.swappiness = 100
# zram pages are read one at a time; read-ahead in swap only wastes CPU.
vm.page-cluster = 0
# Keep the dentry/inode caches a little longer (fewer disk lookups).
vm.vfs_cache_pressure = 50
# Write dirty pages in small batches instead of a percentage of RAM: on a
# 32 GB machine 20 % is 6 GB of pending writes, which stalls the desktop
# when it is finally flushed to a USB stick or an HDD.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# No NMI watchdog: fewer interrupts and timer wakeups on idle cores.
kernel.nmi_watchdog = 0
# Split-lock detection slows down some (mostly Windows) games badly.
-kernel.split_lock_mitigate = 0

# BBR congestion control + fq: faster downloads on lossy or busy links.
net.core.default_qdisc = fq
-net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
