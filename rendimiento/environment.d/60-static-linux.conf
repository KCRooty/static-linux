# Static Linux — bigger GPU shader caches (default ~1 GB fills up after a few
# games, and every eviction means stutter while shaders recompile). These are
# caps, not reservations. Same values in /etc/profile.d/static-linux-gpu.sh
# for sessions that don't read environment.d.
MESA_SHADER_CACHE_MAX_SIZE=12G
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
