# Static Linux — earlyoom: when free RAM and swap both drop under 4 % / 8 %,
# end the biggest process before the desktop freezes. The session, the
# compositor and audio are never picked; browser tabs and Electron apps are
# picked first. (Drop-in for earlyoom.service.)
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 4 -s 8 --avoid "(^|/)(init|systemd|systemd-.*|dbus-broker|Xorg|Xwayland|sshd|lightdm|sddm|gdm|gnome-shell|kwin_wayland|kwin_x11|plasmashell|Hyprland|sway|xfwm4|xfce4-session|cinnamon|openbox|i3|bspwm|pipewire|wireplumber)$$" --prefer "(^|/)(Web Content|Isolated Web Co|chrome|chromium|brave|electron|code|discord|java)$$"
