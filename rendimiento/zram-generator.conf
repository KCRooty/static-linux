# Static Linux — compressed swap in RAM (zram), installed to
# /usr/lib/systemd/zram-generator.conf. To change it, copy it to
# /etc/systemd/zram-generator.conf (that one wins) or use `sl-ctl perf`.
#
# Half the RAM, capped at 8 GB, compressed with zstd (typically 3:1, so
# 8 GB of zram holds ~24 GB of swapped pages). A real swapfile, if there is
# one (machines with < 4 GB of RAM get 2 GB), sits behind it at a lower
# priority.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
