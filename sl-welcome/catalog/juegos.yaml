# El sabor Gaming trae Steam+Proton-GE, Lutris, Heroic, MangoHud y GameMode.
# Esto es lo que queda fuera de ese preset.
category: "Juegos"
apps:
  - id: gamemode
    name: GameMode
    desc: Optimiza el sistema mientras juegas (feral gamemode).
    pkg: gamemode
  - id: mangohud
    name: MangoHud
    desc: Overlay de FPS/temperaturas/uso de CPU-GPU en juegos.
