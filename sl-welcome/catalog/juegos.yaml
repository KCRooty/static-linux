  - id: dolphin-emu
    name: Dolphin Emulator
    desc: Emulador de GameCube/Wii.
    pkg: dolphin-emu
  - id: pcsx2
    name: PCSX2
    desc: Emulador de PlayStation 2.
    pkg: pcsx2
