category: "Utilidades del sistema"
apps:
  - id: timeshift
    name: Timeshift
    desc: Snapshots del sistema con interfaz gráfica (complementa a Snapper).
    pkg: timeshift
  - id: gparted
    name: GParted
    desc: Editor de particiones gráfico. Verifica siempre el disco de destino.
    pkg: gparted
  - id: bleachbit
    name: BleachBit
    desc: Limpieza de archivos temporales y caché.
    pkg: bleachbit
  - id: stacer
    name: Stacer
    desc: Monitor de sistema + limpiador con interfaz gráfica.
    pkg: stacer
    aur: true
  - id: ventoy
    name: Ventoy
    desc: Crear USBs de arranque múltiples (lo que X-USB trae a Android).
    pkg: ventoy
  - id: balena-etcher
    name: balenaEtcher
    desc: Grabar imágenes ISO/IMG en USB/SD de forma sencilla.
    pkg: balena-etcher
    aur: true
  - id: syncthing
    name: Syncthing
    desc: Sincronización de archivos entre equipos, sin nube de por medio.
    pkg: syncthing
  - id: usbguard
    name: USBGuard
    desc: Bloqueo de dispositivos USB no autorizados (también en el perfil Mejorado).
    pkg: usbguard
