# Static Linux — sl-welcome catalog
# Brave ya viene instalado por defecto (docs/PROYECTO.md: "not Firefox, not Chromium").
category: "Internet"
apps:
  - id: firefox
    name: Firefox
    desc: Alternativa a Brave si prefieres Mozilla.
    pkg: firefox
  - id: thunderbird
    name: Thunderbird
    desc: Cliente de correo.
    pkg: thunderbird
  - id: filezilla
    name: FileZilla
    desc: Cliente FTP/SFTP con interfaz gráfica.
    pkg: filezilla
  - id: qbittorrent
    name: qBittorrent
    desc: Cliente BitTorrent sin publicidad.
    pkg: qbittorrent
  - id: transmission-gtk
    name: Transmission
    desc: Cliente BitTorrent minimalista.
    pkg: transmission-gtk
  - id: nextcloud-client
    name: Nextcloud Client
    desc: Sincronización con un servidor Nextcloud propio.
    pkg: nextcloud-client
  - id: localsend
    name: LocalSend
    desc: Enviar archivos a otros dispositivos en la misma red, sin nube.
    pkg: localsend-bin
    aur: true
