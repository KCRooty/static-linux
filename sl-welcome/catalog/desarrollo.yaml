# El sabor Development trae el grueso (VS Code, Docker, Python, Rust, Node,
# Java). Esto es lo que la mayoría no necesita a diario pero se agradece tener
# a mano sin ir al AUR a mano.
category: "Desarrollo"
apps:
  - id: neovim
    name: Neovim
    desc: Vim moderno con soporte LSP.
    pkg: neovim
  - id: lazygit
    name: lazygit
    desc: TUI para Git — commits, ramas y rebases sin salir de la terminal.
    pkg: lazygit
  - id: meld
    name: Meld
    desc: Comparador visual de archivos y carpetas (diffs, merges).
    pkg: meld
  - id: dbeaver
    name: DBeaver
    desc: Cliente universal de bases de datos con interfaz gráfica.
    pkg: dbeaver
  - id: insomnia
    name: Insomnia
    desc: Cliente REST/GraphQL, alternativa a Postman sin cuenta obligatoria.
    pkg: insomnia-bin
    aur: true
  - id: httpie
    name: HTTPie
    desc: Cliente HTTP de línea de comandos, legible por humanos.
    pkg: httpie
  - id: android-tools
    name: Android Tools (adb/fastboot)
    desc: Para flashear/depurar dispositivos Android (útil para X-USB).
    pkg: android-tools
  - id: qemu-full
    name: QEMU
    desc: Emulación/virtualización completa — útil para probar ISOs de Static Linux.
    pkg: qemu-full
